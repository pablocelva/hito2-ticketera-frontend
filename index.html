<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- SEO -->
  <title>Ticketera · Venta de Entradas para Eventos Independientes</title>
  <meta name="description" content="Ticketera: venta de entradas en línea para la escena musical independiente (jazz, funk y neo-soul). Reserva tus entradas de forma segura y sin intermediarios." />
  <meta name="keywords" content="ticketera, entradas, conciertos, eventos, música en vivo, jazz, funk, neo-soul, reservas en línea" />
  <meta name="author" content="Pablo Lambert" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a0a0f" />
  <link rel="canonical" href="https://ticketera-hito-2.netlify.app/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ticketera" />
  <meta property="og:title" content="Ticketera · Venta de Entradas para Eventos Independientes" />
  <meta property="og:description" content="Entradas directas del artista, sin intermediarios. Reserva tus entradas para la escena independiente." />
  <meta property="og:url" content="https://ticketera-hito-2.netlify.app/" />
  <meta property="og:locale" content="es_CL" />
  <meta property="og:image" content="https://ticketera-hito-2.netlify.app/images/placeholder.svg" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="300" />
  <meta property="og:image:alt" content="Ticketera — imagen de evento no disponible" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ticketera · Venta de Entradas para Eventos Independientes" />
  <meta name="twitter:description" content="Entradas directas del artista, sin intermediarios. Reserva tus entradas para la escena independiente." />
  <meta name="twitter:image" content="https://ticketera-hito-2.netlify.app/images/placeholder.svg" />

  <!-- Datos estructurados -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Ticketera",
    "url": "https://ticketera-hito-2.netlify.app/",
    "description": "Venta de entradas en línea para eventos musicales independientes.",
    "inLanguage": "es-CL",
    "publisher": {
      "@type": "Organization",
      "name": "Ticketera"
    }
  }
  </script>

  <!-- Prevenir parpadeo sin estilos (FOUC) -->
  <style>
    html, body {
      background-color: #0a0a0f;
      color: #f4f4f5;
    }
  </style>
  <link rel="stylesheet" href="/src/styles/global.css" />
</head>
<body class="px-4 py-5 md:px-8 md:py-6 max-w-7xl mx-auto">
  <div id="app">
    <header class="animate-fade-up flex flex-col md:flex-row md:items-end justify-between pb-4 mb-5 border-b border-zinc-800 gap-3">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 mb-1.5 rounded bg-violet-950/80 border border-violet-800 text-violet-400 text-[11px] font-black uppercase tracking-widest">
          <span>BOLETERÍA INDEPENDIENTE</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-white leading-none">
          TICKET<span class="text-violet-500">ERA</span>
        </h1>
      </div>
      <p class="text-zinc-400 text-xs md:text-sm font-medium tracking-wide">
        Entradas directas del artista, sin intermediarios.
      </p>
    </header>

    <main>
      <!-- Banner de evento destacado -->
      <div id="contenedor-banner"></div>
      
      <!-- Barra de filtros y ordenamiento -->
      <div id="contenedor-filtros"></div>

      <!-- Barra de sección con contador -->
      <div class="animate-fade-up flex items-center justify-between mb-4 pt-2">
        <h2 class="text-lg md:text-xl font-black uppercase tracking-wider text-white flex items-center gap-2">
          <span class="w-2 h-5 bg-violet-500 rounded-xs inline-block"></span>
          Cartelera de Eventos
        </h2>
        <span id="contador-fechas" class="text-[11px] font-extrabold uppercase tracking-wider text-zinc-300 bg-zinc-900 px-3 py-1 rounded border border-zinc-800">
          Cargando...
        </span>
      </div>

      <!-- Grid de eventos -->
      <div id="contenedor-cartelera" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 items-stretch"></div>

      <!-- Formulario de reserva -->
      <div id="contenedor-reserva" class="mt-8"></div>
    </main>

    <footer id="contenedor-footer"></footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
